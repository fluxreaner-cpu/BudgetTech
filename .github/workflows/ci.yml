name: BudgetTech CI

on:
  push:
    branches:
      - main
      - feature/supabase-postgres-storage
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
